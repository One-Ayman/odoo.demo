[options]
; Odoo master (superadmin) password - protects DB management operations
admin_passwd = OdooDevPWD

; PostgreSQL connection (points at the "DevCourse_db" service on the docker network)
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; Addons
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

; Internal HTTP port inside the container (mapped to host port 8060 in docker-compose.yml)
http_port = 8069
proxy_mode = True
